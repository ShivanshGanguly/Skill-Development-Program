<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGE VERIFIER</title>
</head>

<body>
    <input type="text" placeholder="Enter your name" id="name1">
    <input type="text" placeholder="Enter his/her name" id="name2">
    <button onclick="cal()">Submit</button>
    <h2>Result</h2>
    <p id="res">Here you will get Answer </p>
    <a href="boot.html">Go to Boot</a>
    <script>
        function cal(){
            var name1 = document.getElementById("name1").value;
            var name2 = document.getElementById("name2").value;
            var per = Math.floor(Math.random()*101);
            var res = document.getElementById("res");
            res.innerHTML = "Love between " + name1 + " and " + name2 + " is " + per +"%";
        }
    </script>
</body>

</html>
